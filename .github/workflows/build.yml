name: Build WakeSchool

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier Xcode 27
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: iOS
        run: |
          xcodegen generate
          ls -la
          test -f WakeSchool.xcodeproj/project.pbxproj

      - name: Compiler avec Xcode 27 (sans signature)
        working-directory: iOS
        run: |
          set -o pipefail

          xcodebuild build \
            -project WakeSchool.xcodeproj \
            -scheme WakeSchool \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Vérifier l'application
        working-directory: iOS
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/WakeSchool.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "WakeSchool.app introuvable à $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi

          echo "WakeSchool.app trouvée."
          du -sh "$APP_PATH"

      - name: Créer l'IPA non signée
        working-directory: iOS
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/WakeSchool.app"

          rm -rf Payload WakeSchool-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload WakeSchool-unsigned.ipa

          ls -lh WakeSchool-unsigned.ipa
          unzip -l WakeSchool-unsigned.ipa | head -20

      - name: Publier l'IPA non signée
        uses: actions/upload-artifact@v4
        with:
          name: WakeSchool-unsigned-ipa
          path: iOS/WakeSchool-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Lancer les tests unitaires (simulateur)
        if: github.event_name == 'workflow_dispatch'
        working-directory: iOS
        run: |
          set -o pipefail

          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available iPhone \
            | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "Aucun simulateur iPhone disponible"
            exit 1
          fi

          echo "Simulateur utilisé : $DEVICE_ID"

          xcodebuild test \
            -project WakeSchool.xcodeproj \
            -scheme WakeSchool \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO