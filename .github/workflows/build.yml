name: Build WakeSchool
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest   # reprendre le runner utilisé par AlarmTest si différent
    steps:
      - uses: actions/checkout@v4
      # Reprendre ici l'étape de sélection de Xcode 27 du build.yml d'AlarmTest
      - name: Sélection Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app || true
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        working-directory: iOS
        run: xcodegen generate
      - name: Compiler (sans signature)
        working-directory: iOS
        run: |
          xcodebuild -project WakeSchool.xcodeproj -scheme WakeSchool \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Créer l'IPA non signée
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WakeSchool.app Payload/
          zip -qr WakeSchool.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WakeSchool-unsigned-ipa
          path: iOS/WakeSchool.ipa
