name: WakeSchool
options:
  bundleIdPrefix: com.ayoub
  deploymentTarget:
    iOS: "27.0"
targets:
  WakeSchool:
    type: application
    platform: iOS
    sources:
      - path: WakeSchool
        excludes:
          - "Info.plist"
    info:
      path: WakeSchool/Info.plist
      properties:
        CFBundleDisplayName: WakeSchool
        UILaunchScreen: {}
        NSCameraUsageDescription: "WakeSchool utilise la caméra pour scanner le QR code de connexion PRONOTE."
        NSAlarmKitUsageDescription: "WakeSchool programme ton réveil en fonction de ton emploi du temps."
        CFBundleURLTypes:
          - CFBundleURLName: com.ayoub.wakeschool
            CFBundleURLSchemes:
              - wakeschool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayoub.wakeschool
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: WakeSchool/Pronote/PronoteZlib.h
        OTHER_LDFLAGS: "$(inherited) -lz"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - WakeSchoolTests
    entitlements: WakeSchool/WakeSchool.entitlements
    dependencies:
      - target: WakeSchoolWidget
  WakeSchoolWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WakeSchoolWidget
      - path: WakeSchool/Models/WidgetSharedModels.swift
    info:
      path: WakeSchoolWidget/Info.plist
    entitlements: WakeSchoolWidget/WakeSchoolWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayoub.wakeschool.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  WakeSchoolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WakeSchoolTests
    dependencies:
      - target: WakeSchool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayoub.wakeschool.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon